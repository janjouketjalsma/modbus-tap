# First guesses for a Sosen SSE-HH6K-P1-EU hybrid inverter, polled by an
# Elinter Magpie at slave address 1. Based on one evening capture: verify each
# entry against the inverter display or app before relying on it.
- name: Grid voltage
  address: 37
  scale: 0.1
  precision: 1
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
- name: Grid frequency
  address: 46
  scale: 0.01
  precision: 2
  unit_of_measurement: Hz
  device_class: frequency
  state_class: measurement
- name: Voltage (register 49)
  address: 49
  scale: 0.1
  precision: 1
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
- name: Signed value (register 43)
  address: 43
  data_type: int16
- name: Model
  address: 144
  data_type: string
  count: 8
