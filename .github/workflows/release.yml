name: Release

# Releasing is bumping the version: when the manifest version on main has no
# release yet, this publishes one, with that version's changelog section as notes.
on:
  push:
    branches: [main]
    paths:
      - custom_components/modbus_tap/manifest.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests  # never publish a version whose tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/modbus_tap/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract release notes from the changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[.*\]: / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
